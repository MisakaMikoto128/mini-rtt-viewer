name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    # 项目定位 Windows-only:RTT 数据路径依赖 JLinkARM.dll(FFI 加载,无跨平台
    # 替代),见 docs/product/spec.md PLAT-1。不摆三平台矩阵——编不过的矩阵
    # 是假的跨平台,不如把 Windows 的一条线做扎实。
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked

  web-test:
    # 浏览器管理台黑盒测试(SerialHub 同款回路):Playwright + pytest,
    # 预期只来自 spec 条目(tests/web/test_spec.py)。Windows runner 与
    # 主 job 同因(PLAT-1)。
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test deps
        run: |
          pip install pytest playwright
          playwright install chromium

      - name: Build rtt-web
        run: cargo build --release --locked -p mini-rtt-viewer --bin rtt-web

      - name: Run Playwright suite
        run: python -m pytest tests/web/test_spec.py -v
