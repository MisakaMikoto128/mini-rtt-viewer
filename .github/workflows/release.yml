name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release --locked

      - name: Download UPX
        shell: pwsh
        run: |
          $url = "https://github.com/upx/upx/releases/download/v5.2.1/upx-5.2.1-win64.zip"
          Invoke-WebRequest -Uri $url -OutFile upx.zip
          Expand-Archive -Force upx.zip -DestinationPath upx

      - name: Pack with UPX (tolerate failure)
        shell: pwsh
        run: |
          ./upx/upx-5.2.1-win64/upx.exe --best target/release/mini-rtt-viewer.exe
          exit 0

      # 产物命名契约:mini-rtt-viewer-<版本>-windows-x86_64.zip,
      # 单 exe(桌面窗口内嵌管理台)+ README + LICENSE(解压即用)
      - name: Collect artifact
        shell: pwsh
        run: |
          $ver = "${env:GITHUB_REF_NAME}".TrimStart("v")
          if (-not $ver -or $ver -eq "") { $ver = "dev" }
          $name = "mini-rtt-viewer-$ver-windows-x86_64"
          New-Item -ItemType Directory -Force -Path "pack/$name" | Out-Null
          Copy-Item target/release/mini-rtt-viewer.exe "pack/$name/"
          Copy-Item README.md,LICENSE "pack/$name/"
          Compress-Archive -Force -Path "pack/$name" -DestinationPath "pack/$name.zip"
          $sha = (Get-FileHash "pack/$name.zip" -Algorithm SHA256).Hash.ToLower()
          Write-Host "=== RELEASE SHA256 ($name.zip) ==="
          Write-Host $sha
          Get-ChildItem pack

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: pack/*.zip
          generate_release_notes: true
