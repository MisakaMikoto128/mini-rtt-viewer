[package]
name = "mini-rtt-viewer"
version = "0.3.0"
edition = "2021"

[dependencies]
libloading = "0.8"
anyhow = "1"
# 字符集解码(UTF-8/GBK/UTF-16 LE/Latin-1/ASCII;Firefox 同款,增量解码跨块安全)
encoding_rs = "0.8"
# 用户偏好持久化(%APPDATA%/MiniRttViewer/prefs.json)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 正则搜索(轻量回溯引擎:支持字符类/分组/锚点/(?i),无环视/反向引用;
# 完整 regex DFA 版体积约多 10 倍,日志搜索场景用 lite 足够)
regex-lite = "0.1"
# 字符显示宽度(换行按显示列切:CJK/全角 2 列;零依赖纯表)
unicode-width = "0.2"
# ANSI/VT 转义序列解析(Alacritty/WezTerm 同款状态机;增量式,颜色状态跨块跨行保持)
vte = "0.13"
# ---- 浏览器管理台服务(SerialHub 同构,ADR-11:一个 exe,双击启动本机服务
# 并自动打开浏览器管理台;Slint 桌面 UI 已退役)----
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }

[build-dependencies]
# exe 图标嵌入(Windows 资源编译)
winres = "0.1"

[profile.release]
# opt-level 3(性能优先):RTT 数据路径(UTF-8 增量解码/ANSI 解析/行切分)与
# 服务层吞吐受益于向量化与更激进的内联;体积代价见 CHANGELOG 0.1.8 后的对比
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
