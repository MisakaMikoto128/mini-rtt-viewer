[package]
name = "mini-rtt-viewer"
version = "0.4.1"
edition = "2021"
description = "Mini RTT Viewer — J-Link RTT 查看器:Rust 数据层 + 内嵌 Web 管理台(桌面壳 / 纯服务双形态)"

[dependencies]
libloading = "0.8"
anyhow = "1"
# 字符集解码(UTF-8/GBK/UTF-16 LE/Latin-1/ASCII;Firefox 同款,增量解码跨块安全)
encoding_rs = "0.8"
# 用户偏好持久化(%APPDATA%/MiniRttViewer/prefs.json)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 配置目录解析(dirs::config_dir = SHGetKnownFolderPath RoamingAppData,与
# %APPDATA% 同路径;tao/tray-icon 依赖树已含,声明出来零二进制成本)
dirs = "6"
# 正则搜索(轻量回溯引擎:支持字符类/分组/锚点/(?i),无环视/反向引用;
# 完整 regex DFA 版体积约多 10 倍,日志搜索场景用 lite 足够)
regex-lite = "0.1"
# 字符显示宽度(换行按显示列切:CJK/全角 2 列;零依赖纯表)
unicode-width = "0.2"
# ANSI/VT 转义序列解析(Alacritty/WezTerm 同款状态机;增量式,颜色状态跨块跨行保持)
vte = "0.13"
# ---- 浏览器管理台服务(内嵌 Web UI,桌面壳与 --no-window 共用)----
# SerialHub 同构:Rust 数据层 + 内嵌 Web UI,浏览器/Playwright 可测
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time"] }
# ---- 桌面壳(SerialHub gui.rs 同款:tao 事件循环 + wry WebView + tray-icon)----
wry = "0.57.0"
tao = "0.37.0"
tray-icon = "0.25.0"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
png = "0.17"   # 构建期把托盘/窗口 PNG 解码成 RGBA(存在才嵌入,见 build.rs)
winres = "0.1" # exe 内嵌 app.ico(build.rs 仅在 Windows 目标且文件存在时调用)

[profile.release]
# opt-level 3(性能优先):RTT 数据路径(UTF-8 增量解码/ANSI 解析/行切分)受益于
# 向量化与更激进的内联
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
