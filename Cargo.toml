[package]
name = "mini-rtt-viewer"
version = "0.1.0"
edition = "2021"

[dependencies]
# 精简 features:桌面只需 winit + femtovg;renderer-software 作为显示异常时的兜底
slint = { version = "1", default-features = false, features = [
    "std",
    "compat-1-2",
    "backend-winit",
    "renderer-femtovg",
    "renderer-software",
    "accessibility",
] }
libloading = "0.8"
anyhow = "1"
# ANSI/VT 转义序列解析(Alacritty/WezTerm 同款状态机;增量式,颜色状态跨块跨行保持)
vte = "0.13"

[build-dependencies]
slint-build = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
