<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mini RTT Viewer — 管理台</title>
<link rel="icon" type="image/png" href="favicon.png">
<style>
  /* 主题表(插件化:THEMES 加一项即新主题;与桌面版四主题对齐) */
  :root, :root[data-theme="dark"] {
    --bg:#1b1b1f; --panel:#222228; --card:#2a2a31; --input:#26262c;
    --text:#e8e8ea; --secondary:#a0a0a8; --muted:#6a6a72; --border:#3a3a42;
    --accent:#28afe9; --ok:#4caf50; --err:#cc4455; --log-bg:#222222; --log-fg:#dddddd;
    --search-hit:rgba(255,213,79,.28); --search-hit-current:rgba(255,152,0,.55);
  }
  :root[data-theme="light"] {
    --bg:#f2f3f5; --panel:#ffffff; --card:#eceef1; --input:#ffffff;
    --text:#1a1a1e; --secondary:#55555e; --muted:#8a8a94; --border:#d0d3d9;
    --accent:#1c8cc4; --ok:#2e7d32; --err:#cc3344; --log-bg:#ffffff; --log-fg:#222222;
    --search-hit:rgba(230,180,0,.40); --search-hit-current:rgba(255,145,0,.60);
  }
  :root[data-theme="oled"] {
    --bg:#000000; --panel:#0a0a0a; --card:#111114; --input:#060608;
    --text:#e0e0e0; --secondary:#909096; --muted:#5c5c62; --border:#26262c;
    --accent:#28afe9; --ok:#4caf50; --err:#ff5566; --log-bg:#000000; --log-fg:#d8d8d8;
    --search-hit:rgba(255,213,79,.33); --search-hit-current:rgba(255,152,0,.60);
  }
  :root[data-theme="sepia"] {
    --bg:#f5efdc; --panel:#fbf7e8; --card:#efe8d2; --input:#fdf9ee;
    --text:#3d3322; --secondary:#7a6c4f; --muted:#9a8c6c; --border:#d8cfae;
    --accent:#1c8cc4; --ok:#2e7d32; --err:#b34a44; --log-bg:#faf5e4; --log-fg:#4a3f2a;
    --search-hit:rgba(210,160,30,.35); --search-hit-current:rgba(224,120,32,.55);
  }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 13px/1.5 "Segoe UI", system-ui, sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  select, input, button { background: var(--input); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 6px 10px; font: inherit; }
  select:focus, input:focus, button:focus { outline: none; border-color: var(--accent); }
  button { cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  label.check { display: flex; align-items: center; gap: 6px; font-size: 13px; cursor: pointer; }
  label.check input { width: auto; }

  main { flex: 1; display: flex; min-height: 0; }
  aside { width: 280px; min-width: 280px; background: var(--panel); border-right: 1px solid var(--border);
    overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 14px; }
  .group { border: 1px solid var(--border); border-radius: 8px; padding: 10px; }
  .group > .title { font-size: 12px; color: var(--muted); letter-spacing: 1px; margin-bottom: 8px; }
  .field { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .field > .label { width: 84px; min-width: 84px; font-size: 12px; color: var(--secondary); }
  .field > select, .field > input { flex: 1; min-width: 0; }
  .row2 { display: flex; gap: 8px; }
  .row2 > * { flex: 1; min-width: 0; }
  .btn-col { display: flex; flex-direction: column; gap: 8px; }
  .btn-row { display: flex; gap: 8px; }
  .btn-row button { flex: 1; }

  /* #log 包一层 position:relative wrapper:搜索条浮层锚定其视口右上,
     绝对定位不占用流内空间 → 不改变 #log 可用宽高(无 reflow) */
  #log-wrap { position: relative; flex: 1; min-width: 0; display: flex; }
  #log { flex: 1; min-width: 0; overflow-y: auto; background: var(--log-bg); color: var(--log-fg);
    font-family: Consolas, monospace; font-size: var(--log-fs, 13px); line-height: 1.5; padding: 8px 12px; }
  #log .row { white-space: pre-wrap; word-break: break-all; min-height: 1.5em; }
  /* 命中标记:词级 mark,保留行内 ANSI span 结构(命中子串包 mark,前景色不变) */
  #log mark.s-hit { background: var(--search-hit); color: inherit; border-radius: 2px; }
  #log mark.s-hit.cur { background: var(--search-hit-current); }

  /* VS Code 式日志搜索条(P0):浮于 #log 视口右上,深浅两档投影 */
  #search-bar { position: absolute; top: 8px; right: 12px; width: 340px; height: 32px;
    display: flex; align-items: center; gap: 3px; padding: 0 5px 0 6px; z-index: 40;
    background: var(--panel); border: 1px solid var(--border); border-radius: 6px;
    box-shadow: 0 1px 2px rgba(0,0,0,.18), 0 6px 16px rgba(0,0,0,.24); }
  #search-bar[hidden] { display: none; }
  #search-bar .s-btn { width: 24px; height: 24px; min-width: 24px; padding: 0;
    border: 1px solid transparent; border-radius: 4px; background: transparent;
    color: var(--secondary); font-size: 12px; line-height: 1;
    display: flex; align-items: center; justify-content: center; }
  #search-bar .s-btn:focus { border-color: transparent; }
  #search-bar .s-btn:hover:not(:disabled) { border-color: transparent; color: var(--text); }
  #search-bar .s-btn.on { background: color-mix(in srgb, var(--accent) 15%, transparent);
    color: var(--accent); }
  #search-bar .s-btn:disabled { opacity: .4; }
  #s-input { flex: 1; min-width: 0; height: 24px; padding: 0 6px;
    font: 13px Consolas, monospace; background: var(--input);
    border: 1px solid var(--border); border-radius: 4px; }
  #s-input.err, #s-input.err:focus { border-color: var(--err); }
  #s-count { font-size: 12px; color: var(--muted); min-width: 36px; text-align: center;
    white-space: nowrap; }
  #s-count.err { color: var(--err); }
  .info-grid { display: grid; grid-template-columns: 84px 1fr; gap: 4px 8px; font-size: 12px; }
  .info-grid .k { color: var(--secondary); }

  footer { display: flex; gap: 16px; padding-right: 16px; padding: 8px 16px; background: var(--panel);
    border-top: 1px solid var(--border); font-size: 12px; color: var(--secondary); align-items: center; }
  footer .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--err); }
  footer .dot.on { background: var(--ok); }
  footer .spacer { flex: 1; }
  header { display: flex; align-items: center; gap: 12px; padding: 8px 16px;
    background: var(--panel); border-bottom: 1px solid var(--border); }
  header .title { font-weight: 700; }
  header .spacer { flex: 1; }
  .hint { color: var(--muted); font-size: 12px; margin-top: 6px; }
  /* 可编辑下拉(输入即筛选,参考工程波特率框同款交互)
     容器化:边框/圆角/底色收归 .combo,input 与箭头透明无边框(P0-1/P2-9) */
  .combo { position: relative; flex: 1; min-width: 0; display: flex; height: 40px;
    background: var(--input); border: 1px solid var(--border); border-radius: 8px; }
  .combo:focus-within { border: 2px solid var(--accent); }
  .combo > input { flex: 1; min-width: 0; border: none; background: transparent;
    padding: 9px 12px; font-size: 14px; }
  .combo > input:focus { border: none; }
  .combo > .arrow { width: 34px; min-width: 34px; border: none; background: transparent;
    color: var(--accent); padding: 0; display: flex; align-items: center; justify-content: center;
    cursor: pointer; }
  .combo > .arrow:hover { opacity: .75; }
  /* 浮层卡片质感(P1-6):var(--card) 底 + 10px 圆角 + 深投影;
     间距 8px(P2-10):top:100% 锚在 padding 盒上,扣除聚焦态 2px 边框后实测 6-7px */
  .combo-list { position: absolute; top: 100%; left: 0; right: 0; margin-top: 8px;
    background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 6px;
    max-height: 220px; overflow-y: auto; z-index: 30; display: none;
    box-shadow: 0 8px 24px rgba(0,0,0,.4); }
  /* 候选项胶囊化(P0-3/P1-7):圆角胶囊、项间 2px、hover/激活/当前值 accent 底白字 */
  .combo-list .opt { padding: 9px 12px; margin: 2px 0; cursor: pointer; font-size: 13px;
    border-radius: 7px; }
  .combo-list .opt:first-child { margin-top: 0; }
  .combo-list .opt:last-child { margin-bottom: 0; }
  .combo-list .opt:hover, .combo-list .opt.active, .combo-list .opt.current {
    background: var(--accent); color: #fff; font-weight: 600; }
  /* 细滚动条(P2-11,可选) */
  .combo-list::-webkit-scrollbar { width: 6px; }
  .combo-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
</head>
<body>
<header>
  <span class="title">Mini RTT Viewer</span>
  <span class="hint">浏览器管理台(与桌面版同一数据管线)</span>
  <span class="spacer"></span>
  <span class="hint">主题</span>
  <select id="theme" style="width:130px">
    <option value="dark">深色</option>
    <option value="light">浅色</option>
    <option value="oled">OLED 纯黑</option>
    <option value="sepia">护眼暖色</option>
  </select>
</header>
<main>
  <aside>
    <div class="group">
      <div class="title">连接设置</div>
      <div class="field"><span class="label">J-Link</span>
        <select id="jlink"></select></div>
      <div class="field"><span class="label">目标设备</span>
        <div class="combo" id="chip-combo">
          <input id="chip" autocomplete="off" placeholder="STM32F103C8">
          <button class="arrow" id="chip-arrow" tabindex="-1" aria-label="展开设备库">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3.5 6 8 10.5 12.5 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <div class="combo-list" id="chip-list"></div>
        </div></div>
      <div class="field"><span class="label">接口</span>
        <select id="iface"><option value="0">SWD</option><option value="1">JTAG</option></select></div>
      <div class="row2 field">
        <div style="flex:1"><div style="font-size:12px;color:var(--secondary);margin-bottom:4px">速度 (kHz)</div>
          <select id="speed" style="width:100%"><option>100</option><option>200</option><option>500</option><option selected>1000</option><option>2000</option><option>4000</option><option>8000</option><option>12000</option></select></div>
        <div style="flex:1"><div style="font-size:12px;color:var(--secondary);margin-bottom:4px">RTT 通道</div>
          <select id="channel" style="width:100%"><option>0</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option></select></div>
      </div>
      <div class="btn-col">
        <button id="connect-btn" class="primary">连接</button>
        <button id="disconnect-btn" disabled>断开</button>
        <button id="reset-btn" disabled>重置目标</button>
      </div>
    </div>

    <details class="group" open>
      <div class="title">► 设备信息</div>
      <div class="info-grid" id="device-info">
        <span class="k">固件版本</span><span>—</span>
        <span class="k">目标芯片</span><span>—</span>
        <span class="k">接口</span><span>—</span>
        <span class="k">序列号</span><span>—</span>
      </div>
    </details>

    <div class="group">
      <div class="title">接收</div>
      <div class="btn-row" style="margin-bottom:8px">
        <button id="clear-btn">清空</button>
        <button id="pause-btn">暂停</button>
        <button id="mark-btn">标记</button>
        <button id="export-btn">导出</button>
      </div>
      <label class="check" style="margin-bottom:8px"><input type="checkbox" id="auto-frame" checked> 自动断帧</label>
      <div class="field" style="margin-bottom:8px"><span class="label">间隔</span>
        <input type="text" id="frame-timeout" value="20"><span style="font-size:12px;color:var(--muted)">ms</span></div>
      <label class="check" style="margin-bottom:8px"><input type="checkbox" id="power" disabled> 电源输出 (19 脚)</label>
      <label class="check" style="margin-bottom:8px"><input type="checkbox" id="auto-scroll" checked> 自动滚动</label>
      <div class="btn-row" style="margin-bottom:8px">
        <button id="A-minus">A-</button><button id="A-plus">A+</button>
      </div>
      <div class="field" style="margin-bottom:8px"><span class="label">行尾</span>
        <select id="rx-ending">
          <option value="0" selected>自动</option><option value="1">CRLF</option>
          <option value="2">LF</option><option value="3">CR</option><option value="4">无</option>
        </select></div>
      <div class="field" style="margin-bottom:8px"><span class="label">字符集</span>
        <select id="encoding">
          <option value="0" selected>UTF-8</option><option value="1">GBK</option>
          <option value="2">UTF-16 LE</option><option value="3">Latin-1</option><option value="4">ASCII</option>
        </select></div>
      <label class="check"><input type="checkbox" id="hex-rx"> HEX 接收(动态生效)</label>
    </div>

    <div class="group">
      <div class="title">发送</div>
      <div class="field" style="margin-bottom:8px"><span class="label">发送行尾</span>
        <select id="tx-ending">
          <option value="0" selected>CRLF</option><option value="1">LF</option>
          <option value="2">CR</option><option value="3">无</option>
        </select></div>
      <label class="check" style="margin-bottom:8px"><input type="checkbox" id="hex-send"> HEX 发送(输入按十六进制字节)</label>
      <label class="check" style="margin-bottom:8px"><input type="checkbox" id="timer-on"> 定时发送(重发最近发送内容)</label>
      <div class="field" style="margin-bottom:8px"><span class="label">间隔</span>
        <input type="text" id="timer-interval" value="1"><span style="font-size:12px;color:var(--muted)">秒</span></div>
      <label for="send-text" style="font-size:12px;color:var(--secondary)">发送到通道 0(Enter 发送)</label>
      <div class="send-row">
        <input type="text" id="send-text" placeholder="hello">
        <button id="send-btn" disabled>发送</button>
      </div>
      <p class="hint">行尾 / 字符集 / HEX 接收 / 断帧间隔均动态生效,无需重连。</p>
    </div>
  </aside>
  <div id="log-wrap">
    <div id="log"></div>
    <div id="search-bar" hidden>
      <button class="s-btn" id="s-case" title="区分大小写" tabindex="-1">Aa</button>
      <button class="s-btn" id="s-regex" title="使用正则表达式" tabindex="-1">.*</button>
      <input id="s-input" type="text" placeholder="查找" spellcheck="false" autocomplete="off">
      <span id="s-count">—</span>
      <button class="s-btn" id="s-prev" title="上一处 (Shift+Enter)" tabindex="-1">↑</button>
      <button class="s-btn" id="s-next" title="下一处 (Enter)" tabindex="-1">↓</button>
      <button class="s-btn" id="s-close" title="关闭 (Esc)" tabindex="-1">×</button>
    </div>
  </div>
</main>
<footer>
  <span class="dot" id="dot"></span>
  <span id="status">未连接</span>
  <span class="spacer"></span>
  <span id="chip-line">— · —</span>
  <span id="tx">TX 0 B</span>
  <span id="rx">RX 0 B</span>
  <span id="rows">0 行</span>
</footer>
<script>
  const $ = id => document.getElementById(id);
  const API = location.origin;
  const log = $('log');
  const fmt = n => n < 1024 ? n + ' B' : (n / 1024).toFixed(1) + ' KB';
  let connected = false, autoScroll = true;

  function appendRow(row) {
    const div = document.createElement('div');
    div.className = 'row';
    for (const run of row.runs) {
      const span = document.createElement('span');
      span.textContent = run.text;
      if (run.fg) span.style.color = run.fg;
      div.appendChild(span);
    }
    // 行记录 = 搜索的文本索引:runs 原文数组 + 行全文;搜索高亮重绘行时按 runs
    // 重建内联色 → 不破坏行内 ANSI span 结构
    const rec = { el: div, runs: row.runs, text: row.runs.map(r => r.text).join(''),
      ranges: [], renderedRef: null };
    div.__rec = rec;
    rec.renderedRef = rec.ranges; // 当前 DOM 即无高亮形态
    log.appendChild(div);
    if (searchOpen) { scanRec(rec); updateCount(); } // 新行增量扫描:只更新计数,不滚动
  }
  function trim() {
    const removed = [];
    // 上限与服务端 MAX_LOG_ROWS=500 对齐:底栏行数口径才与 DOM 一致
    while (log.children.length > 500) { removed.push(log.firstChild); log.removeChild(log.firstChild); }
    if (removed.length) onRowsRemoved(removed);
  }
  // 自动滚动互斥:搜索条打开期间流式新行不拉回底部;唯一滚动来源是命中导航
  function scrollBottom() { if (searchOpen) return; if (autoScroll) log.scrollTop = log.scrollHeight; }
  let clearSeq = 0;
  function onMsg(ev) {
    const m = JSON.parse(ev.data);
    if (m.type === 'snapshot') { resetRows(); m.rows.forEach(appendRow); scrollBottom(); }
    else if (m.type === 'cleared') { clearSeq = m.seq; resetRows(); window.__clearedCount = (window.__clearedCount || 0) + 1; }
    else if (m.type === 'rows') {
      if (m.seq <= clearSeq) return;
      if (m.dropped) {
        const removed = [];
        for (let i = 0; i < m.dropped && log.firstChild; i++) { removed.push(log.firstChild); log.removeChild(log.firstChild); }
        onRowsRemoved(removed);
      }
      m.rows.forEach(appendRow); trim(); scrollBottom();
    }
    else if (m.type === 'state') setState(m.connected, m.status);
    else if (m.type === 'device') renderDevice(m.info);
    else if (m.type === 'progress') $('status').textContent = m.text.replace('● ', '');
    else if (m.type === 'names') fillDatalist(m.names);
    else if (m.type === 'jlinks') fillJlinks(m.list);
    else if (m.type === 'stats') {
      $('tx').textContent = 'TX ' + fmt(m.tx);
      $('rx').textContent = 'RX ' + fmt(m.rx);
      $('rows').textContent = m.rows + ' 行';
    }
  }
  function setState(on, status) {
    connected = on;
    $('dot').classList.toggle('on', on);
    if (status) $('status').textContent = status.replace('● ', '');
    $('connect-btn').textContent = on ? '已连接' : '连接';
    $('connect-btn').disabled = on;
    $('disconnect-btn').disabled = !on;
    $('reset-btn').disabled = !on;
    $('power').disabled = !on;
    $('send-btn').disabled = !on;
    for (const id of ['jlink', 'chip', 'iface', 'speed', 'channel']) $(id).disabled = on;
  }
  function renderDevice(d) {
    if (!d) return;
    const g = $('device-info');
    g.innerHTML = '';
    const put = (k, v) => {
      const a = document.createElement('span'); a.className = 'k'; a.textContent = k;
      const b = document.createElement('span'); b.textContent = v || '—';
      g.append(a, b);
    };
    put('固件版本', d.firmware);
    put('目标芯片', d.target);
    put('接口', (d.iface || '—') + ' · ' + (d.speedKhz || '—') + 'kHz');
    put('序列号', d.serial);
    $('chip-line').textContent = (d.target || '—') + ' · ' + (d.iface || '—');
  }
  // 可编辑下拉:输入即筛选,↑↓ 选择,Enter 确认,Esc 关闭,箭头展开全部
  // P0-4:浮层默认隐藏,仅聚焦/输入/点箭头展开;失焦/Esc/选中后关闭
  let chipOptions = [];
  let chipListOpen = false;
  function fillDatalist(names) {
    chipOptions = names;
    renderChipList($('chip').value); // 只重绘候选,不改开合状态 → names 到达不再自动展开
  }
  function renderChipList(filter) {
    const list = $('chip-list');
    const f = (filter || '').toUpperCase();
    // P1-8:与当前 #chip 值一致的候选常驻 accent 底白字(忽略大小写)
    const cur = ($('chip').value || '').trim().toUpperCase();
    const opts = chipOptions.filter(o => o.toUpperCase().includes(f));
    list.innerHTML = opts.map(o =>
      '<div class="opt' + (o.toUpperCase() === cur ? ' current' : '') +
      '" data-v="' + o.replace(/"/g, '&quot;') + '">' + o + '</div>'
    ).join('');
    list.style.display = (chipListOpen && opts.length) ? 'block' : 'none';
    list.querySelectorAll('.opt').forEach(el => {
      el.addEventListener('mousedown', e => { e.preventDefault(); pickChip(el.dataset.v); });
    });
  }
  function openChipList(filter) {
    chipListOpen = true;
    renderChipList(filter !== undefined ? filter : $('chip').value);
  }
  function closeChipList() {
    chipListOpen = false;
    $('chip-list').style.display = 'none';
  }
  function pickChip(v) {
    $('chip').value = v;
    closeChipList();
  }
  (function initChipCombo() {
    const input = $('chip'), list = $('chip-list');
    input.addEventListener('input', () => openChipList());
    input.addEventListener('focus', () => openChipList());
    input.addEventListener('blur', () => setTimeout(closeChipList, 150));
    input.addEventListener('keydown', e => {
      const items = [...list.querySelectorAll('.opt')];
      let active = items.findIndex(el => el.classList.contains('active'));
      if (e.key === 'ArrowDown' && items.length) {
        e.preventDefault();
        active = Math.min(active + 1, items.length - 1);
        items.forEach((el, i) => el.classList.toggle('active', i === active));
        items[active].scrollIntoView({ block: 'nearest' });
      } else if (e.key === 'ArrowUp' && items.length) {
        e.preventDefault();
        active = Math.max(active - 1, 0);
        items.forEach((el, i) => el.classList.toggle('active', i === active));
        items[active].scrollIntoView({ block: 'nearest' });
      } else if (e.key === 'Enter') {
        e.preventDefault();
        if (active >= 0) pickChip(items[active].dataset.v);
        else if (items.length === 1) pickChip(items[0].dataset.v);
      } else if (e.key === 'Escape') {
        closeChipList();
      }
    });
    $('chip-arrow').addEventListener('mousedown', e => e.preventDefault());
    $('chip-arrow').onclick = () => { chipListOpen ? closeChipList() : openChipList(''); };
  })();
  function fillJlinks(list) {
    $('jlink').innerHTML = '<option value="">自动</option>' +
      list.map(j => '<option value="' + j.sn + '">' + j.name + '</option>').join('');
  }

  function connect() {
    const body = {
      chip: $('chip').value,
      ifaceIndex: +$('iface').value,
      speedIndex: $('speed').selectedIndex,
      channel: +$('channel').value,
    };
    fetch(API + '/api/connect', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body) })
      .then(r => { if (!r.ok) r.text().then(t => { $('status').textContent = t; }); });
  }
  $('connect-btn').onclick = connect;
  $('disconnect-btn').onclick = () => fetch(API + '/api/disconnect', { method: 'POST' });
  $('reset-btn').onclick = () => fetch(API + '/api/reset', { method: 'POST' });
  $('power').onchange = e => fetch(API + '/api/power', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ on: e.target.checked }) });

  // 运行时设置:changed → POST settings(worker 原子热切换,动态生效)
  $('rx-ending').onchange = e => postSettings({ rxEnding: +e.target.value });
  $('encoding').onchange = e => postSettings({ encodingIndex: +e.target.value });
  $('hex-rx').onchange = e => postSettings({ hexRx: e.target.checked });
  $('frame-timeout').addEventListener('change', e => {
    const v = parseInt(e.target.value, 10);
    if (!isNaN(v)) postSettings({ frameTimeout: v });
  });
  function postSettings(patch) {
    return fetch(API + '/api/settings', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(patch) });
  }
  // 定时发送:连接态才触发,重发最近一次发送的内容(0.001-999 秒);
  // 间隔非法自动停,不弹错误
  $('timer-on').onchange = e => postTimer({ on: e.target.checked });
  $('timer-interval').addEventListener('change', e => {
    const v = parseFloat(e.target.value);
    if (v >= 0.001 && v <= 999) postTimer({ on: $('timer-on').checked, intervalSec: v });
    else { $('timer-on').checked = false; postTimer({ on: false }); }
  });
  function postTimer(body) {
    const box = $('send-text');
    if (box.value.trim()) body.text = box.value;  // 可选:显式指定定时内容(默认最近发送)
    return fetch(API + '/api/timer', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body) });
  }
  // 导出日志:全部行文本附件下载(rtt_<时间戳>.log,服务端 Content-Disposition)
  $('export-btn').onclick = () => {
    const a = document.createElement('a');
    a.href = API + '/api/export'; a.download = '';
    document.body.appendChild(a); a.click(); a.remove();
  };

  $('pause-btn').onclick = function () {
    const paused = this.textContent === '暂停';
    fetch(API + '/api/pause', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ on: paused }) })
      .then(() => { this.textContent = paused ? '继续' : '暂停'; });
  };
  $('clear-btn').onclick = () => fetch(API + '/api/clear', { method: 'POST' }).then(() => resetRows());
  $('mark-btn').onclick = () => fetch(API + '/api/mark', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ text: '' }) });
  $('send-btn').onclick = send;
  $('send-text').addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
  function send() {
    const input = $('send-text');
    if (!input.value.trim()) return;
    fetch(API + '/api/send', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ text: input.value }) })
      .then(r => { if (r.ok) input.value = ''; });
  }
  $('auto-scroll').onchange = e => { autoScroll = e.target.checked; if (autoScroll) scrollBottom(); };

  // 字号 A±(纯前端,localStorage 记忆)
  let logFs = +(localStorage.getItem('web-log-fs') || 13);
  function applyFs() { log.style.fontSize = logFs + 'px'; localStorage.setItem('web-log-fs', logFs); }
  $('A-minus').onclick = () => { logFs = Math.max(9, logFs - 1); applyFs(); };
  $('A-plus').onclick = () => { logFs = Math.min(30, logFs + 1); applyFs(); };
  applyFs();

  // 主题(localStorage 记忆)
  const themeSel = $('theme');
  themeSel.onchange = () => { document.documentElement.dataset.theme = themeSel.value; localStorage.setItem('web-theme', themeSel.value); };
  themeSel.value = localStorage.getItem('web-theme') || 'dark';
  document.documentElement.dataset.theme = themeSel.value;

  // ===== VS Code 式日志搜索(P0)=====
  // 数据源:#log 已渲染行文本(≤500,与服务端 MAX_LOG_ROWS 一致;被裁剪即不可搜);按行匹配,不跨行。
  // 词级高亮按 runs 重建保留 ANSI span;命中上限 2000 封顶;高亮重绘 rAF 批量提交。
  const sBar = $('search-bar'), sInput = $('s-input'), sCount = $('s-count');
  const sPrev = $('s-prev'), sNext = $('s-next'), sClose = $('s-close');
  const sCaseBtn = $('s-case'), sRegexBtn = $('s-regex');
  let searchOpen = false;
  let scase = localStorage.getItem('search.case') === '1';   // 持久化:开关;query 不持久化
  let sregex = localStorage.getItem('search.regex') === '1';
  let sre = null, serrMsg = '';       // 编译后的行匹配正则 / 非法正则原始消息
  let matches = [];                   // 有序命中 [{rec, rg}](与 DOM 行序一致,裁剪时构成前缀)
  let sCur = -1;                      // 当前命中下标,-1 = 未定位
  let capped = false;                 // 命中达 2000 封顶
  let sDebT = 0, sRaf = 0;
  let sDebouncing = false;            // debounce 窗口:计数位保持 —,不闪上一轮陈旧计数
  const sPending = new Set();         // 待重绘行(rAF 批量提交)

  function selectionInLog() {
    const sel = window.getSelection();
    if (!sel || sel.isCollapsed || !sel.rangeCount) return '';
    const node = sel.getRangeAt(0).commonAncestorContainer;
    if (node !== log && !log.contains(node)) return '';
    return sel.toString();
  }
  function compileQuery() {
    sre = null; serrMsg = '';
    const q = sInput.value;
    if (!q) return;
    const src = sregex ? q : q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    try { sre = new RegExp(src, scase ? 'g' : 'gi'); }
    catch (e) { serrMsg = e.message; }
  }
  // 单行扫描:产出命中区间(行内偏移)入全局有序 matches,2000 封顶
  function scanRec(rec) {
    const ranges = [];
    if (sre && !capped) {
      sre.lastIndex = 0;
      let m;
      while ((m = sre.exec(rec.text))) {
        if (!m[0].length) { // 零宽匹配防御(如 a*):跳过并前进,防死循环
          sre.lastIndex++;
          if (sre.lastIndex > rec.text.length) break;
          continue;
        }
        ranges.push({ s: m.index, e: m.index + m[0].length });
        if (matches.length + ranges.length >= 2000) { capped = true; break; }
      }
    }
    rec.ranges = ranges;
    for (const rg of ranges) matches.push({ rec, rg });
    const plain = !ranges.length && (!rec.renderedRef || !rec.renderedRef.length);
    if (plain) rec.renderedRef = ranges; // DOM 已是无高亮形态,免重绘
    else queueRender(rec);
  }
  function curRgOf(rec) {
    return (sCur >= 0 && sCur < matches.length && matches[sCur].rec === rec)
      ? matches[sCur].rg : null;
  }
  // 按 runs 重建行内容:命中子串包 mark.s-hit,其余片段还原 span+内联 fg → 内联色可复现
  function renderRow(rec) {
    const curRg = curRgOf(rec);
    const el = rec.el;
    el.textContent = '';
    let off = 0;
    for (const run of rec.runs) {
      const s = off, e = off + run.text.length;
      let pos = s;
      for (const rg of rec.ranges) {
        if (rg.e <= s || rg.s >= e) continue;
        const a = Math.max(rg.s, s), b = Math.min(rg.e, e);
        if (a > pos) seg(el, run, pos - s, a - s, false, false);
        seg(el, run, a - s, b - s, true, rg === curRg);
        pos = b;
      }
      if (pos < e) seg(el, run, pos - s, e - s, false, false);
      off = e;
    }
    rec.renderedRef = rec.ranges;
  }
  function seg(el, run, from, to, hit, cur) {
    const n = document.createElement(hit ? 'mark' : 'span');
    n.textContent = run.text.slice(from, to);
    if (run.fg) n.style.color = run.fg; // 前景色不变
    if (hit) n.className = cur ? 's-hit cur' : 's-hit';
    el.appendChild(n);
  }
  function queueRender(rec) {
    sPending.add(rec);
    if (!sRaf) sRaf = requestAnimationFrame(() => {
      sRaf = 0;
      const list = [...sPending]; sPending.clear();
      for (const r of list) if (r.el.isConnected) renderRow(r);
    });
  }
  function rebuild() { // 全量重算:重编正则 → 逐行扫描 → 只重绘高亮状态变化的行
    compileQuery();
    matches = []; sCur = -1; capped = false;
    for (const el of [...log.children]) {
      if (el.__rec) scanRec(el.__rec);
    }
    updateCount();
  }
  function updateCount() {
    if (sDebouncing) return; // debounce 窗口(含流式新行的增量计数):维持 —,到期后由 rebuild 显示新结果
    sInput.classList.toggle('err', !!serrMsg);
    if (!sInput.value) { sCount.textContent = '—'; sCount.className = ''; sCount.title = ''; }
    else if (serrMsg) { sCount.textContent = '无效正则'; sCount.className = 'err'; sCount.title = 'RegExp: ' + serrMsg; }
    else if (!matches.length) { sCount.textContent = '0/0'; sCount.className = 'err'; sCount.title = ''; }
    else {
      sCount.textContent = (sCur + 1) + '/' + (capped ? '2000+' : matches.length);
      sCount.className = ''; sCount.title = '';
    }
    const dis = !!serrMsg || !sInput.value || !matches.length; // 错误态/空 query/无命中 → 导航禁用
    sPrev.disabled = sNext.disabled = dis;
  }
  // 导航滚动:当前命中行已整个可见则不动,否则垂直居中;此滚动视为手动滚动
  function revealHit(el) {
    const lr = log.getBoundingClientRect(), er = el.getBoundingClientRect();
    if (er.top >= lr.top && er.bottom <= lr.bottom) return;
    log.scrollTop += (er.top + er.bottom) / 2 - (lr.top + lr.bottom) / 2;
  }
  function setCurrent(i) {
    const prev = sCur >= 0 && sCur < matches.length ? matches[sCur] : null;
    sCur = i;
    const cur = matches[i];
    if (prev && prev.rec !== cur.rec) renderRow(prev.rec);
    renderRow(cur.rec);
    revealHit(cur.rec.el);
    updateCount();
  }
  function navigate(dir) {
    if (!sre || serrMsg || !sInput.value || !matches.length) return;
    let i = sCur + dir;
    if (i >= matches.length) i = 0;             // 循环环绕
    if (i < 0) i = matches.length - 1;
    setCurrent(i);
  }
  function resetRows() { // 行 DOM 清空(清空/快照重建):高亮回 IDLE,query 与开关保留
    log.innerHTML = '';
    matches = []; sCur = -1; capped = false; sPending.clear();
    updateCount();
  }
  // 行被 DOM 裁剪(>500,与服务端 MAX_LOG_ROWS 对齐):摘除其命中(命中序与行序一致 → 被裁行命中构成前缀);
  // 当前命中所在行被裁 → 推进至下一存活命中(不滚动)
  function onRowsRemoved(els) {
    if (!matches.length) return;
    const set = new Set(els);
    let cut = 0;
    while (cut < matches.length && set.has(matches[cut].rec.el)) cut++;
    if (!cut) return;
    matches.splice(0, cut);
    if (sCur >= 0) {
      sCur = sCur < cut ? (matches.length ? 0 : -1) : sCur - cut;
      if (sCur >= 0) renderRow(matches[sCur].rec);
    }
    updateCount();
  }
  function clearHighlights() {
    matches = []; sCur = -1; capped = false;
    for (const el of [...log.children]) {
      const rec = el.__rec;
      if (rec && rec.ranges.length) { rec.ranges = []; queueRender(rec); }
    }
  }
  function openSearch() {
    const first = !searchOpen;
    searchOpen = true;
    sBar.hidden = false;
    const sel = selectionInLog();               // 仅当 #log 内有文本选区才带入
    if (sel) {
      sInput.value = sel.split('\n')[0].slice(0, 200);
      rebuild();                                // 带入选区即重算
    } else if (first) {
      rebuild();                                // 首次打开:全量重算,不滚动不定位
    }
    sInput.focus();
    sInput.select();                            // query 全选,键入即覆盖
  }
  function closeSearch() {
    if (!searchOpen) return;
    searchOpen = false;
    sBar.hidden = true;
    clearHighlights();                            // 清全部高亮;query 与开关保留内存
  }
  function refreshToggles() {
    sCaseBtn.classList.toggle('on', scase);
    sRegexBtn.classList.toggle('on', sregex);
  }
  sCaseBtn.onclick = () => {                      // 开关切换:立即重算
    scase = !scase; localStorage.setItem('search.case', scase ? '1' : '0');
    refreshToggles(); if (searchOpen) rebuild();
  };
  sRegexBtn.onclick = () => {
    sregex = !sregex; localStorage.setItem('search.regex', sregex ? '1' : '0');
    refreshToggles(); if (searchOpen) rebuild();
    // 正则开关同步服务端偏好(重启后面板初值恢复)
    postSettings({ searchRegex: sregex }).catch(() => {});
  };
  sInput.addEventListener('input', () => {        // 输入即搜:150ms debounce 全量重算
    clearTimeout(sDebT);
    // 输入即清计数位为 —(含 err 类):debounce 窗口内不显示上一轮陈旧计数
    sDebouncing = true;
    sCount.textContent = '—';
    sCount.className = '';
    sCount.title = '';
    sDebT = setTimeout(() => { sDebouncing = false; if (searchOpen) rebuild(); }, 150);
  });
  sInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); navigate(e.shiftKey ? -1 : 1); }
  });
  sNext.addEventListener('click', () => { navigate(1); sInput.focus(); });
  sPrev.addEventListener('click', () => { navigate(-1); sInput.focus(); });
  sClose.addEventListener('click', closeSearch);
  // document 级接管(capture,先于页内 handler):Ctrl+F 打开、F3/Shift+F3 导航、Esc 关闭
  document.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && !e.altKey && !e.shiftKey && (e.key === 'f' || e.key === 'F')) {
      e.preventDefault();
      openSearch();
    } else if (e.key === 'F3') {
      if (searchOpen) { e.preventDefault(); navigate(e.shiftKey ? -1 : 1); }
    } else if (e.key === 'Escape' && searchOpen) {
      e.preventDefault();
      closeSearch();
    }
  }, true);
  refreshToggles();

  function connectWS() {
    const ws = new WebSocket(API.replace('http', 'ws') + '/ws');
    ws.onmessage = onMsg;
    ws.onclose = () => setTimeout(connectWS, 1500);
  }
  connectWS();
  setInterval(() => fetch(API + '/api/status').then(r => r.json()).then(s => {
    if (connected !== s.connected) setState(s.connected, null);
  }).catch(() => {}), 2000);
  fetch(API + '/api/devices').then(r => r.json()).then(fillDatalist).catch(() => {});
  fetch(API + '/api/jlinks').then(r => r.json()).then(fillJlinks).catch(() => {});
  fetch(API + '/api/status').then(r => r.json()).then(s => { if (s.device) renderDevice(s.device); }).catch(() => {});
  // 面板初值恢复:服务端持久化偏好(%APPDATA% prefs.json,500ms 快照)。
  // 主题/字号仍走 localStorage,不经此通道
  fetch(API + '/api/prefs').then(r => r.json()).then(p => {
    if (p.chip) $('chip').value = p.chip;
    $('iface').value = String(p.ifaceIndex);
    $('speed').selectedIndex = Math.min(p.speedIndex, $('speed').length - 1);
    $('channel').selectedIndex = Math.min(p.channel, $('channel').length - 1);
    $('rx-ending').value = String(p.rxEnding);
    $('frame-timeout').value = p.frameTimeout;
    $('encoding').value = String(p.encodingIndex);
    $('hex-rx').checked = !!p.hexRx;
    $('auto-frame').checked = !!p.autoFrame;
    if (p.timerIntervalSec != null) $('timer-interval').value = p.timerIntervalSec;
    $('timer-on').checked = !!p.timerOn;
    if (typeof p.searchRegex === 'boolean') {
      sregex = p.searchRegex;
      localStorage.setItem('search.regex', sregex ? '1' : '0');
      refreshToggles();
    }
  }).catch(() => {});
</script>
</body>
</html>
