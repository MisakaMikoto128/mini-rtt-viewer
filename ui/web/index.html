<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mini RTT Viewer — 管理台</title>
<link rel="icon" type="image/png" href="favicon.png">
<style>
  /* 主题表(四主题按降饱和钢蓝系统一重配;与桌面版四主题对齐)
     基准:body/日志底 #0E1013、卡片 #16181D、边框 #262A31、accent #2B6E8F */
  :root, :root[data-theme="dark"] {
    --bg:#0E1013; --panel:#0E1013; --card:#16181D; --input:#0F1216; --btn:#232830;
    --text:#E6E8EB; --secondary:#9AA0A8; --muted:#6A7078; --border:#262A31;
    --accent:#2B6E8F; --ok:#4C9E62; --err:#C95F68; --danger:#A84E58;
    --log-bg:#0E1013; --log-fg:#D8DBE0; --log-fs:15px;
    --search-hit:rgba(255,213,79,.28); --search-hit-current:rgba(255,152,0,.55);
  }
  :root[data-theme="light"] {
    --bg:#EEF1F4; --panel:#EEF1F4; --card:#FFFFFF; --input:#F3F5F7; --btn:#E7EBEF;
    --text:#1E2226; --secondary:#5F6B76; --muted:#8B949D; --border:#D3D8DE;
    --accent:#2B6E8F; --ok:#2E7D32; --err:#C4454E; --danger:#C05A54;
    --log-bg:#FFFFFF; --log-fg:#24282C;
    --search-hit:rgba(230,180,0,.40); --search-hit-current:rgba(255,145,0,.60);
  }
  :root[data-theme="oled"] {
    --bg:#000000; --panel:#000000; --card:#0C0E11; --input:#050607; --btn:#181C22;
    --text:#E2E4E7; --secondary:#9AA0A8; --muted:#5E646B; --border:#22262C;
    --accent:#2B6E8F; --ok:#4C9E62; --err:#D0606A; --danger:#B0505A;
    --log-bg:#000000; --log-fg:#D4D7DB;
    --search-hit:rgba(255,213,79,.33); --search-hit-current:rgba(255,152,0,.60);
  }
  :root[data-theme="sepia"] {
    --bg:#F0E8D5; --panel:#F0E8D5; --card:#F9F3E3; --input:#F2EBD9; --btn:#EAE0C6;
    --text:#3A3222; --secondary:#7C6E52; --muted:#9C8F70; --border:#D8CCAA;
    --accent:#356A80; --ok:#4E7D46; --err:#B34A44; --danger:#AC5548;
    --log-bg:#F6F0DF; --log-fg:#463C28;
    --search-hit:rgba(210,160,30,.35); --search-hit-current:rgba(224,120,32,.55);
  }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 13px/1.5 "Segoe UI", system-ui, sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

  /* 控件基线(UX 规格):统一高 40px / 字号 14px / 圆角 6px;按钮高 42px
     (特例:#send-btn 115×40;搜索条内 s-btn / combo 箭头由更specific选择器覆盖) */
  select, input:not([type="checkbox"]), button {
    background: var(--input); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 0 12px; font-family: inherit; font-size: 14px; height: 40px; }
  select:focus, input:focus, button:focus { outline: none; border-color: var(--accent); }
  button { cursor: pointer; height: 42px; padding: 0 14px; background: var(--btn); }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: default; }
  select:disabled, input:disabled { opacity: .55; }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  button.primary:hover:not(:disabled) { filter: brightness(1.12); }
  button.danger { background: var(--danger); color: #fff; border-color: var(--danger); }
  label.check { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--secondary);
    cursor: pointer; min-height: 20px; }
  label.check input { width: 15px; height: 15px; accent-color: var(--accent); margin: 0; flex: none; }
  .unit { font-size: 12px; color: var(--muted); }

  main { flex: 1; display: flex; min-height: 0; }
  /* 左面板 420px(1280 视口下约 1/3);组间距 12px,内容超出才滚动 */
  aside { width: 420px; min-width: 420px; background: var(--panel); border-right: 1px solid var(--border);
    overflow-y: auto; padding: 8px 12px; display: flex; flex-direction: column; gap: 12px; }
  /* 分组卡:bg #16181D / border 1px #262A31 / radius 8px / padding 14px */
  .group { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 14px;
    display: flex; flex-direction: column; gap: 6px; }
  .group > .title, summary.title { font-size: 14px; font-weight: 600; color: var(--text); }
  summary.title { cursor: pointer; list-style: none; display: flex; align-items: center; gap: 6px; }
  summary.title::-webkit-details-marker { display: none; }
  summary.title::before { content: '▸'; color: var(--muted); font-size: 12px; }
  details[open] > summary.title::before { content: '▾'; }
  /* 标签在控件上方:label 13px #9AA0A8 在上,控件全宽在下 */
  .field { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .field > .label { font-size: 13px; line-height: 1.2; color: var(--secondary); }
  .field > select, .field > input, .field > .combo { width: 100%; }
  /* .combo 的 flex:1 是给横排共享宽度用的;在纵向 .field 里必须关掉,否则
     flex-basis:0 吃进主轴(纵向=高度)把容器压瘪 */
  .field > .combo { flex: none; }
  .row2 { display: flex; gap: 8px; }
  .row2 > .field { flex: 1; min-width: 0; }
  .btn-row { display: flex; gap: 8px; }
  .btn-row button { flex: 1; padding: 0; }
  /* 断帧行合并:checkbox + label + input(80px)+ ms 同排 */
  .aframe-row { display: flex; align-items: center; gap: 8px; }
  .aframe-row label.check { flex: 1; }
  #frame-timeout { width: 80px; flex: none; }
  .check2 { display: flex; gap: 12px; }
  .check2 > label.check { flex: 1; }
  /* 字号 A± 与主题下拉同区(接收组底部) */
  .theme-row { display: flex; align-items: center; gap: 8px; }
  .theme-row button { width: 44px; padding: 0; flex: none; }
  .theme-row select { flex: 1; min-width: 0; }
  .info-grid { display: grid; grid-template-columns: auto 1fr auto 1fr; gap: 4px 10px; font-size: 12px; }
  .info-grid .k { color: var(--secondary); }

  /* 右列:日志(flex:1)+ 发送条(通栏,border-top 分隔) */
  #content { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  /* #log 包一层 position:relative wrapper:搜索条浮层锚定其视口右上,
     绝对定位不占用流内空间 → 不改变 #log 可用宽高(无 reflow) */
  #log-wrap { position: relative; flex: 1; min-height: 0; display: flex; }
  #log { flex: 1; min-width: 0; overflow-y: auto; background: var(--log-bg); color: var(--log-fg);
    font-family: Consolas, monospace; font-size: var(--log-fs, 15px); line-height: 32px; padding: 8px 12px; }
  #log .row { white-space: pre-wrap; word-break: break-all; min-height: 32px; }
  /* 命中标记:词级 mark,保留行内 ANSI span 结构(命中子串包 mark,前景色不变) */
  #log mark.s-hit { background: var(--search-hit); color: inherit; border-radius: 2px; }
  #log mark.s-hit.cur { background: var(--search-hit-current); }

  /* 发送条:日志区下方通栏,input flex:1 高 40px + 发送按钮 115×40 */
  #send-bar { display: flex; align-items: center; gap: 8px; padding: 8px 12px;
    border-top: 1px solid var(--border); background: var(--panel); }
  #send-text { flex: 1; min-width: 0; }
  #send-btn { width: 115px; flex: none; height: 40px; }

  /* VS Code 式日志搜索条(P0):浮于 #log 视口右上,深浅两档投影 */
  #search-bar { position: absolute; top: 8px; right: 12px; width: 340px; height: 32px;
    display: flex; align-items: center; gap: 3px; padding: 0 5px 0 6px; z-index: 40;
    background: var(--panel); border: 1px solid var(--border); border-radius: 6px;
    box-shadow: 0 1px 2px rgba(0,0,0,.18), 0 6px 16px rgba(0,0,0,.24); }
  #search-bar[hidden] { display: none; }
  #search-bar .s-btn { width: 24px; height: 24px; min-width: 24px; padding: 0;
    border: 1px solid transparent; border-radius: 4px; background: transparent;
    color: var(--secondary); font-size: 12px; line-height: 1;
    display: flex; align-items: center; justify-content: center; }
  #search-bar .s-btn:focus { border-color: transparent; }
  #search-bar .s-btn:hover:not(:disabled) { border-color: transparent; color: var(--text); }
  #search-bar .s-btn.on { background: color-mix(in srgb, var(--accent) 15%, transparent);
    color: var(--accent); }
  #search-bar .s-btn:disabled { opacity: .4; }
  #s-input { flex: 1; min-width: 0; height: 24px; padding: 0 6px;
    font: 13px Consolas, monospace; background: var(--input);
    border: 1px solid var(--border); border-radius: 4px; }
  #s-input.err, #s-input.err:focus { border-color: var(--err); }
  #s-count { font-size: 12px; color: var(--muted); min-width: 36px; text-align: center;
    white-space: nowrap; }
  #s-count.err { color: var(--err); }

  /* 日志区右键菜单(复制选中文本 / 全选) */
  #ctx-menu { position: fixed; z-index: 60; min-width: 150px; background: var(--card);
    border: 1px solid var(--border); border-radius: 8px; padding: 4px;
    box-shadow: 0 8px 24px rgba(0,0,0,.4); }
  #ctx-menu[hidden] { display: none; }
  .ctx-item { padding: 7px 12px; font-size: 13px; border-radius: 5px; cursor: pointer; color: var(--text); }
  .ctx-item:hover { background: var(--accent); color: #fff; }
  .ctx-item.disabled { opacity: .4; pointer-events: none; }

  footer { display: flex; gap: 16px; padding: 8px 16px; background: var(--panel);
    border-top: 1px solid var(--border); font-size: 12px; color: var(--secondary); align-items: center; }
  footer .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--err); }
  footer .dot.on { background: var(--ok); }
  footer .spacer { flex: 1; }

  /* 可编辑下拉(输入即筛选,参考工程波特率框同款交互)
     容器化:边框/圆角/底色收归 .combo,input 与箭头透明无边框(P0-1/P2-9) */
  .combo { position: relative; flex: 1; min-width: 0; display: flex; height: 40px;
    background: var(--input); border: 1px solid var(--border); border-radius: 6px; }
  .combo:focus-within { border: 2px solid var(--accent); }
  .combo > input { flex: 1; min-width: 0; border: none; background: transparent;
    height: 100%; padding: 0 12px; font-size: 14px; }
  .combo > input:focus { border: none; }
  .combo > .arrow { width: 34px; min-width: 34px; height: 100%; border: none; background: transparent;
    color: var(--accent); padding: 0; display: flex; align-items: center; justify-content: center;
    cursor: pointer; }
  .combo > .arrow:hover { opacity: .75; }
  /* 浮层卡片质感(P1-6):var(--card) 底 + 10px 圆角 + 深投影;
     间距 8px(P2-10):top:100% 锚在 padding 盒上,扣除聚焦态 2px 边框后实测 6-7px */
  .combo-list { position: absolute; top: 100%; left: 0; right: 0; margin-top: 8px;
    background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 6px;
    max-height: 220px; overflow-y: auto; z-index: 30; display: none;
    box-shadow: 0 8px 24px rgba(0,0,0,.4); }
  /* 候选项胶囊化(P0-3/P1-7):圆角胶囊、项间 2px、hover/激活/当前值 accent 底白字 */
  .combo-list .opt { padding: 9px 12px; margin: 2px 0; cursor: pointer; font-size: 13px;
    border-radius: 7px; }
  .combo-list .opt:first-child { margin-top: 0; }
  .combo-list .opt:last-child { margin-bottom: 0; }
  .combo-list .opt:hover, .combo-list .opt.active, .combo-list .opt.current {
    background: var(--accent); color: #fff; font-weight: 600; }
  /* 细滚动条(P2-11,可选) */
  .combo-list::-webkit-scrollbar { width: 6px; }
  .combo-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
</head>
<body>
<main>
  <aside>
    <div class="group">
      <div class="title">连接设置</div>
      <div class="field"><span class="label">J-Link</span>
        <select id="jlink"></select></div>
      <div class="field"><span class="label">目标设备</span>
        <div class="combo" id="chip-combo">
          <input id="chip" autocomplete="off" placeholder="STM32F103C8">
          <button class="arrow" id="chip-arrow" tabindex="-1" aria-label="展开设备库">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3.5 6 8 10.5 12.5 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <div class="combo-list" id="chip-list"></div>
        </div></div>
      <div class="row2">
        <div class="field"><span class="label">接口</span>
          <select id="iface"><option value="0">SWD</option><option value="1">JTAG</option></select></div>
        <div class="field"><span class="label">速度 (kHz)</span>
          <select id="speed"><option>100</option><option>200</option><option>500</option><option selected>1000</option><option>2000</option><option>4000</option><option>8000</option><option>12000</option></select></div>
      </div>
      <div class="field"><span class="label">RTT 通道</span>
        <select id="channel"><option>0</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option><option>9</option><option>10</option><option>11</option><option>12</option><option>13</option><option>14</option><option>15</option></select></div>
      <button id="connect-btn" class="primary">连接</button>
      <button id="reset-btn" disabled>重置目标</button>
    </div>

    <details class="group" id="device-details">
      <summary class="title">设备信息</summary>
      <div class="info-grid" id="device-info">
        <span class="k">固件版本</span><span>—</span>
        <span class="k">目标芯片</span><span>—</span>
        <span class="k">接口</span><span>—</span>
        <span class="k">序列号</span><span>—</span>
      </div>
    </details>

    <div class="group">
      <div class="title">接收</div>
      <div class="btn-row">
        <button id="clear-btn">清空</button>
        <button id="pause-btn">暂停</button>
        <button id="mark-btn">标记</button>
        <button id="export-btn">导出</button>
      </div>
      <div class="aframe-row">
        <label class="check"><input type="checkbox" id="auto-frame" checked> 自动断帧</label>
        <input type="text" id="frame-timeout" value="20">
        <span class="unit">ms</span>
      </div>
      <div class="check2">
        <label class="check"><input type="checkbox" id="auto-scroll" checked> 自动滚动</label>
        <label class="check"><input type="checkbox" id="power" disabled> 电源输出 (19 脚)</label>
      </div>
      <div class="row2">
        <div class="field"><span class="label">行尾</span>
          <select id="rx-ending">
            <option value="0" selected>自动</option><option value="1">CRLF</option>
            <option value="2">LF</option><option value="3">CR</option><option value="4">无</option>
          </select></div>
        <div class="field"><span class="label">字符集</span>
          <select id="encoding">
            <option value="0" selected>UTF-8</option><option value="1">GBK</option>
            <option value="2">UTF-16 LE</option><option value="3">Latin-1</option><option value="4">ASCII</option>
          </select></div>
      </div>
      <label class="check"><input type="checkbox" id="hex-rx"> HEX 接收(动态生效)</label>
      <div class="theme-row">
        <button id="A-minus" title="减小日志字号">A-</button>
        <button id="A-plus" title="增大日志字号">A+</button>
        <select id="theme">
          <option value="dark">深色</option>
          <option value="light">浅色</option>
          <option value="oled">OLED 纯黑</option>
          <option value="sepia">护眼暖色</option>
        </select>
      </div>
    </div>

    <div class="group">
      <div class="title">发送</div>
      <div class="row2">
        <div class="field"><span class="label">发送行尾</span>
          <select id="tx-ending">
            <option value="0" selected>CRLF</option><option value="1">LF</option>
            <option value="2">CR</option><option value="3">无</option>
          </select></div>
        <div class="field"><span class="label">定时间隔 (秒)</span>
          <input type="text" id="timer-interval" value="1"></div>
      </div>
      <label class="check"><input type="checkbox" id="hex-send"> HEX 发送(输入按十六进制字节)</label>
      <label class="check"><input type="checkbox" id="timer-on"> 定时发送(重发最近发送内容)</label>
    </div>
  </aside>
  <section id="content">
    <div id="log-wrap">
      <div id="log"></div>
      <div id="search-bar" hidden>
        <button class="s-btn" id="s-case" title="区分大小写" tabindex="-1">Aa</button>
        <button class="s-btn" id="s-regex" title="使用正则表达式" tabindex="-1">.*</button>
        <input id="s-input" type="text" placeholder="查找" spellcheck="false" autocomplete="off">
        <span id="s-count">—</span>
        <button class="s-btn" id="s-prev" title="上一处 (Shift+Enter)" tabindex="-1">↑</button>
        <button class="s-btn" id="s-next" title="下一处 (Enter)" tabindex="-1">↓</button>
        <button class="s-btn" id="s-close" title="关闭 (Esc)" tabindex="-1">×</button>
      </div>
    </div>
    <div id="send-bar">
      <input type="text" id="send-text" placeholder="发送到通道 0… (Enter 发送)" autocomplete="off">
      <button id="send-btn" disabled>发送</button>
    </div>
  </section>
</main>
<footer>
  <span class="dot" id="dot"></span>
  <span id="status">未连接</span>
  <span class="spacer"></span>
  <span id="chip-line">— · —</span>
  <span id="tx">TX 0 B</span>
  <span id="rx">RX 0 B</span>
  <span id="rows">0 行</span>
</footer>
<div id="ctx-menu" hidden>
  <div class="ctx-item" id="ctx-copy">复制选中文本</div>
  <div class="ctx-item" id="ctx-selectall">全选</div>
</div>
<script>
  const $ = id => document.getElementById(id);
  const API = location.origin;
  const log = $('log');
  const fmt = n => n < 1024 ? n + ' B' : (n / 1024).toFixed(1) + ' KB';
  let connected = false, autoScroll = true;

  // 偏好 localStorage(key 前缀 web-):change 写入,加载回填;
  // /api/prefs(服务端持久化)到达后覆盖其管辖字段,此处为离线/失败兜底
  function lsGet(k) { return localStorage.getItem('web-' + k); }
  function lsSet(k, v) { localStorage.setItem('web-' + k, v); }
  (function restorePrefs() {
    const g = lsGet;
    if (g('rx-ending')) $('rx-ending').value = g('rx-ending');
    if (g('tx-ending')) $('tx-ending').value = g('tx-ending');
    if (g('encoding')) $('encoding').value = g('encoding');
    if (g('channel') !== null && g('channel') !== '') $('channel').value = g('channel');
    if (g('iface')) $('iface').value = g('iface');
    const sp = g('speed');
    if (sp !== null && sp !== '') $('speed').selectedIndex = Math.min(+sp, $('speed').length - 1);
    if (g('hex-rx')) $('hex-rx').checked = g('hex-rx') === '1';
    if (g('hex-send')) $('hex-send').checked = g('hex-send') === '1';
    if (g('auto-frame')) $('auto-frame').checked = g('auto-frame') === '1';
    if (g('auto-scroll')) { $('auto-scroll').checked = g('auto-scroll') === '1'; autoScroll = $('auto-scroll').checked; }
    if (g('frame-timeout')) $('frame-timeout').value = g('frame-timeout');
  })();

  function appendRow(row) {
    const div = document.createElement('div');
    div.className = 'row';
    for (const run of row.runs) {
      const span = document.createElement('span');
      span.textContent = run.text;
      if (run.fg) span.style.color = run.fg;
      div.appendChild(span);
    }
    // 行记录 = 搜索的文本索引:runs 原文数组 + 行全文;搜索高亮重绘行时按 runs
    // 重建内联色 → 不破坏行内 ANSI span 结构
    const rec = { el: div, runs: row.runs, text: row.runs.map(r => r.text).join(''),
      ranges: [], renderedRef: null };
    div.__rec = rec;
    rec.renderedRef = rec.ranges; // 当前 DOM 即无高亮形态
    log.appendChild(div);
    if (searchOpen) { scanRec(rec); updateCount(); } // 新行增量扫描:只更新计数,不滚动
  }
  function trim() {
    const removed = [];
    // 上限与服务端 MAX_LOG_ROWS=500 对齐:底栏行数口径才与 DOM 一致
    while (log.children.length > 500) { removed.push(log.firstChild); log.removeChild(log.firstChild); }
    if (removed.length) onRowsRemoved(removed);
  }
  // 自动滚动互斥:搜索条打开期间流式新行不拉回底部;唯一滚动来源是命中导航
  function scrollBottom() { if (searchOpen) return; if (autoScroll) log.scrollTop = log.scrollHeight; }
  let clearSeq = 0;
  function onMsg(ev) {
    const m = JSON.parse(ev.data);
    if (m.type === 'snapshot') { resetRows(); m.rows.forEach(appendRow); scrollBottom(); }

  // ===== VS Code 式日志搜索(P0)=====
  // 数据源:#log 已渲染行文本(≤500,与服务端 MAX_LOG_ROWS 一致;被裁剪即不可搜);按行匹配,不跨行。
  // 词级高亮按 runs 重建保留 ANSI span;命中上限 2000 封顶;高亮重绘 rAF 批量提交。
  const sBar = $('search-bar'), sInput = $('s-input'), sCount = $('s-count');
  const sPrev = $('s-prev'), sNext = $('s-next'), sClose = $('s-close');
  const sCaseBtn = $('s-case'), sRegexBtn = $('s-regex');
  let searchOpen = false;
  let scase = (lsGet('search-case') ?? localStorage.getItem('search.case')) === '1';  // 持久化:开关;query 不持久化
  let sregex = (lsGet('search-regex') ?? localStorage.getItem('search.regex')) === '1';
  let sre = null, serrMsg = '';       // 编译后的行匹配正则 / 非法正则原始消息
  let matches = [];                   // 有序命中 [{rec, rg}](与 DOM 行序一致,裁剪时构成前缀)
  let sCur = -1;                      // 当前命中下标,-1 = 未定位
  let capped = false;                 // 命中达 2000 封顶

  function selectionInLog() {
    const sel = window.getSelection();
    if (!sel || sel.isCollapsed || !sel.rangeCount) return '';

    if (node !== log && !log.contains(node)) return '';

  }
  function compileQuery() {
    sre = null; serrMsg = '';

    if (!q) return;
    const src = sregex ? q : q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    try { sre = new RegExp(src, scase ? 'g' : 'gi'); }
    catch (e) { serrMsg = e.message; }
  }
  // 单行扫描:产出命中区间(行内偏移)入全局有序 matches,2000 封顶
  function scanRec(rec) {
    const ranges = [];
    if (sre && !capped) {
      sre.lastIndex = 0;
      let m;
      while ((m = sre.exec(rec.text))) {
        if (!m[0].length) { // 零宽匹配防御(如 a*):跳过并前进,防死循环
          sre.lastIndex++;
          if (sre.lastIndex > rec.text.length) break;
          continue;
        }
        ranges.push({ s: m.index, e: m.index + m[0].length });
        if (matches.length + ranges.length >= 2000) { capped = true; break; }
      }
    }
    rec.ranges = ranges;
    for (const rg of ranges) matches.push({ rec, rg });
    const plain = !ranges.length && (!rec.renderedRef || !rec.renderedRef.length);
    if (plain) rec.renderedRef = ranges; // DOM 已是无高亮形态,免重绘
    else queueRender(rec);
  }
  function curRgOf(rec) {
    return (sCur >= 0 && sCur < matches.length && matches[sCur].rec === rec)
      ? matches[sCur].rg : null;
  }
  // 按 runs 重建行内容:命中子串包 mark.s-hit,其余片段还原 span+内联 fg → 内联色可复现
  function renderRow(rec) {
    const curRg = curRgOf(rec);
    const el = rec.el;
    el.textContent = '';
    let off = 0;
    for (const run of rec.runs) {
      const s = off, e = off + run.text.length;
      let pos = s;
      for (const rg of rec.ranges) {
        if (rg.e <= s || rg.s >= e) continue;
        const a = Math.max(rg.s, s), b = Math.min(rg.e, e);
        if (a > pos) seg(el, run, pos - s, a - s, false, false);
        seg(el, run, a - s, b - s, true, rg === curRg);
        pos = b;
      }

    }

  }
  function seg(el, run, from, to, hit, cur) {
    const n = document.createElement(hit ? 'mark' : 'span');
    n.textContent = run.text.slice(from, to);

  function rebuild() { // 全量重算:重编正则 → 逐行扫描 → 只重绘高亮状态变化的行
    compileQuery();

  }
  function updateCount() {
    if (sDebouncing) return; // debounce 窗口(含流式新行的增量计数):维持 —,到期后由 rebuild 显示新结果
    sInput.classList.toggle('err', !!serrMsg);
    if (!sInput.value) { sCount.textContent = '—'; sCount.className = ''; sCount.title = ''; }
    else if (serrMsg) { sCount.textContent = '无效正则'; sCount.className = 'err'; sCount.title = 'RegExp: ' + serrMsg; }
    else if (!matches.length) { sCount.textContent = '0/0'; sCount.className = 'err'; sCount.title = ''; }

  function revealHit(el) {

    renderRow(cur.rec);

    if (!sre || serrMsg || !sInput.value || !matches.length) return;

  }
  // 行被 DOM 裁剪(>500,与服务端 MAX_LOG_ROWS 对齐):摘除其命中(命中序与行序一致 → 被裁行命中构成前缀);
  // 当前命中所在行被裁 → 推进至下一存活命中(不滚动)
  function onRowsRemoved(els) {

  }
  function openSearch() {
    const first = !searchOpen;
    searchOpen = true;

    const sel = selectionInLog();               // 仅当 #log 内有文本选区才带入
    if (sel) {
      sInput.value = sel.split('\n')[0].slice(0, 200);
      rebuild();                                // 带入选区即重算
    } else if (first) {
      rebuild();                                // 首次打开:全量重算,不滚动不定位
    }
    sInput.focus();
    sInput.select();                            // query 全选,键入即覆盖
  }
  function closeSearch() {
    if (!searchOpen) return;
    searchOpen = false;
    sBar.hidden = true;
    clearHighlights();                            // 清全部高亮;query 与开关保留内存
  }
  function refreshToggles() {
    sCaseBtn.classList.toggle('on', scase);
    sRegexBtn.classList.toggle('on', sregex);
  }
  sCaseBtn.onclick = () => {                      // 开关切换:立即重算
    scase = !scase; lsSet('search-case', scase ? '1' : '0');
    refreshToggles(); if (searchOpen) rebuild();
  };
  sRegexBtn.onclick = () => {
    sregex = !sregex; lsSet('search-regex', sregex ? '1' : '0');
    refreshToggles(); if (searchOpen) rebuild();
    // 正则开关同步服务端偏好(重启后面板初值恢复)
    postSettings({ searchRegex: sregex }).catch(() => {});
  };
  sInput.addEventListener('input', () => {        // 输入即搜:150ms debounce 全量重算
    clearTimeout(sDebT);
    // 输入即清计数位为 —(含 err 类):debounce 窗口内不显示上一轮陈旧计数
    sDebouncing = true;
    sCount.textContent = '—';
    sCount.className = '';
    sCount.title = '';
    sDebT = setTimeout(() => { sDebouncing = false; if (searchOpen) rebuild(); }, 150);
  });
  sInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); navigate(e.shiftKey ? -1 : 1); }
  });
  sNext.addEventListener('click', () => { navigate(1); sInput.focus(); });
  sPrev.addEventListener('click', () => { navigate(-1); sInput.focus(); });
  sClose.addEventListener('click', closeSearch);
  // document 级接管(capture,先于页内 handler):Ctrl+F 打开、F3/Shift+F3 导航、Esc 关闭
  document.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && !e.altKey && !e.shiftKey && (e.key === 'f' || e.key === 'F')) {
      e.preventDefault();
      openSearch();
    } else if (e.key === 'F3') {
      if (searchOpen) { e.preventDefault(); navigate(e.shiftKey ? -1 : 1); }
    } else if (e.key === 'Escape' && searchOpen) {
      e.preventDefault();
      closeSearch();
    }
  }, true);
  refreshToggles();

  function connectWS() {
    const ws = new WebSocket(API.replace('http', 'ws') + '/ws');
    ws.onmessage = onMsg;
    ws.onclose = () => setTimeout(connectWS, 1500);
  }
  connectWS();
  setInterval(() => fetch(API + '/api/status').then(r => r.json()).then(s => {
    if (connected !== s.connected) setState(s.connected, null);
  }).catch(() => {}), 2000);
  fetch(API + '/api/devices').then(r => r.json()).then(fillDatalist).catch(() => {});
  fetch(API + '/api/jlinks').then(r => r.json()).then(fillJlinks).catch(() => {});
  fetch(API + '/api/status').then(r => r.json()).then(s => { if (s.device) renderDevice(s.device); }).catch(() => {});
  // 面板初值恢复:服务端持久化偏好(%APPDATA% prefs.json,500ms 快照)。
  // 主题/字号仍走 localStorage,不经此通道
  fetch(API + '/api/prefs').then(r => r.json()).then(p => {
    if (p.chip) $('chip').value = p.chip;
    $('iface').value = String(p.ifaceIndex);
    lsSet('iface', String(p.ifaceIndex));
    $('speed').selectedIndex = Math.min(p.speedIndex, $('speed').length - 1);
    lsSet('speed', String($('speed').selectedIndex));
    $('channel').selectedIndex = Math.min(p.channel, $('channel').length - 1);
    lsSet('channel', String($('channel').selectedIndex));
    $('rx-ending').value = String(p.rxEnding);
    lsSet('rx-ending', String(p.rxEnding));
    $('frame-timeout').value = p.frameTimeout;
    lsSet('frame-timeout', String(p.frameTimeout));
    $('encoding').value = String(p.encodingIndex);
    lsSet('encoding', String(p.encodingIndex));
    $('hex-rx').checked = !!p.hexRx;
    lsSet('hex-rx', p.hexRx ? '1' : '0');
    $('auto-frame').checked = !!p.autoFrame;
    lsSet('auto-frame', p.autoFrame ? '1' : '0');
    if (p.timerIntervalSec != null) $('timer-interval').value = p.timerIntervalSec;
    $('timer-on').checked = !!p.timerOn;
    if (typeof p.searchRegex === 'boolean') {
      sregex = p.searchRegex;
      lsSet('search-regex', sregex ? '1' : '0');
      refreshToggles();
    }
  }).catch(() => {});
</script>
</body>
</html>
