<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mini RTT Viewer — 管理台</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<main>
  <aside id="sidebar" aria-label="连接与设备">
    <div class="sidebar-head">
      <strong>连接与设备</strong>
      <button type="button" id="sidebar-close" aria-label="关闭连接设置">×</button>
    </div>
    <div class="aside-scroll">
      <div class="group">
        <div class="title">连接设置</div>
        <div class="field"><span class="label">J-Link</span>
          <select id="jlink" aria-label="J-Link 调试器"></select></div>
        <div class="field"><span class="label">数据源</span>
          <select id="backend" aria-label="数据源后端"></select></div>
        <div class="field"><span class="label">目标设备</span>
          <div class="combo" id="chip-combo">
            <input id="chip" autocomplete="off" placeholder="STM32F103C8" role="combobox"
              aria-autocomplete="list" aria-expanded="false" aria-controls="chip-list">
            <button type="button" class="arrow" id="chip-arrow" aria-label="展开设备库"
              aria-expanded="false" aria-controls="chip-list">
              <svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3.5 6 8 10.5 12.5 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <div class="combo-list" id="chip-list" role="listbox" aria-label="目标设备候选"></div>
          </div></div>
        <div class="row3">
          <div class="field"><span class="label">接口</span>
            <select id="iface"><option value="0">SWD</option><option value="1">JTAG</option></select></div>
          <div class="field"><span class="label">速度 (kHz)</span>
            <select id="speed"><option>100</option><option>200</option><option>500</option><option selected>1000</option><option>2000</option><option>4000</option><option>8000</option><option>12000</option></select></div>
          <div class="field"><span class="label">RTT 通道</span>
            <select id="channel"><option>0</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option><option>9</option><option>10</option><option>11</option><option>12</option><option>13</option><option>14</option><option>15</option></select></div>
        </div>
        <div class="connect-actions">
          <button type="button" id="connect-btn" class="primary">连接</button>
          <button type="button" id="reset-btn" disabled>重置目标</button>
        </div>
        <div class="power-row">
          <label class="check"><input type="checkbox" id="power" disabled> 电源输出</label>
          <span class="power-note">J-Link 19 脚供电</span>
        </div>
      </div>
      <details class="group" id="device-details">
        <summary class="title">设备信息</summary>
        <div class="info-grid" id="device-info">
          <span class="k">固件版本</span><span>—</span>
          <span class="k">目标芯片</span><span>—</span>
          <span class="k">接口</span><span>—</span>
          <span class="k">序列号</span><span>—</span>
        </div>
      </details>
    </div>
  </aside>
  <section id="content">
    <div id="log-toolbar" aria-label="日志工具条">
      <button type="button" id="sidebar-toggle" aria-controls="sidebar" aria-expanded="true">连接设置</button>
      <div class="log-actions">
        <button type="button" id="clear-btn">清空</button>
        <button type="button" id="pause-btn" aria-pressed="false">暂停</button>
        <button type="button" id="mark-btn">标记</button>
        <button type="button" id="export-btn">导出</button>
      </div>
      <div class="display-controls">
        <label class="check"><input type="checkbox" id="auto-scroll" checked> 自动滚动</label>
        <label class="check" title="行首显示本机到达时刻 [HH:MM:SS.mmm](仅开关打开后到达的行)"><input type="checkbox" id="timestamps"> 时间戳</label>
        <div class="font-controls" aria-label="日志字号">
          <button type="button" id="A-minus" title="减小日志字号" aria-label="减小日志字号">A-</button>
          <button type="button" id="A-plus" title="增大日志字号" aria-label="增大日志字号">A+</button>
        </div>
        <select id="theme" aria-label="界面主题">
          <option value="dark">深色</option><option value="light">浅色</option>
          <option value="oled">OLED 纯黑</option><option value="sepia">护眼暖色</option>
        </select>
      </div>
    </div>
    <div id="receive-bar" aria-label="接收设置">
      <div class="frame-control">
        <label class="check"><input type="checkbox" id="auto-frame" checked> 自动断帧</label>
        <input type="text" id="frame-timeout" value="20" aria-label="断帧间隔毫秒">
        <span class="unit">ms</span>
      </div>
      <label class="inline-field">行尾
        <select id="rx-ending">
          <option value="0" selected>自动</option><option value="1">CRLF</option>
          <option value="2">LF</option><option value="3">CR</option><option value="4">无</option>
        </select>
      </label>
      <label class="inline-field">字符集
        <select id="encoding">
          <option value="0" selected>UTF-8</option><option value="1">GBK</option>
          <option value="2">UTF-16 LE</option><option value="3">Latin-1</option><option value="4">ASCII</option>
        </select>
      </label>
      <label class="check"><input type="checkbox" id="hex-rx"> HEX 接收</label>
    </div>
    <div id="log-wrap">
      <div id="log" role="log" aria-label="RTT 日志" aria-live="off" tabindex="0"></div>
      <div id="search-bar" hidden>
        <button type="button" class="s-btn" id="s-case" title="区分大小写" aria-label="区分大小写" aria-pressed="false">Aa</button>
        <button type="button" class="s-btn" id="s-regex" title="使用正则表达式" aria-label="使用正则表达式" aria-pressed="false">.*</button>
        <input id="s-input" type="text" placeholder="查找" spellcheck="false" autocomplete="off" aria-label="查找日志">
        <span id="s-count" aria-live="polite">—</span>
        <button type="button" class="s-btn" id="s-prev" title="上一处 (Shift+Enter)" aria-label="上一处">↑</button>
        <button type="button" class="s-btn" id="s-next" title="下一处 (Enter)" aria-label="下一处">↓</button>
        <button type="button" class="s-btn" id="s-close" title="关闭 (Esc)" aria-label="关闭搜索">×</button>
      </div>
    </div>
    <div id="send-bar">
      <div id="send-opts">
        <div class="send-modes">
          <label class="check" title="输入按十六进制字节发送"><input type="checkbox" id="hex-send"> HEX 发送</label>
          <label class="check" title="按设定间隔重发最近发送的内容"><input type="checkbox" id="timer-on"> 定时发送</label>
        </div>
        <div id="timer-fields" hidden>
          <label class="s-label" for="timer-interval">定时间隔</label>
          <input type="text" id="timer-interval" value="1" inputmode="decimal">
          <span class="s-label">秒</span>
        </div>
        <span class="spacer"></span>
        <label class="s-label" for="tx-ending">发送行尾</label>
        <select id="tx-ending">
          <option value="0" selected>CRLF</option><option value="1">LF</option>
          <option value="2">CR</option><option value="3">无</option>
        </select>
      </div>
      <div class="send-main">
        <textarea id="send-text" rows="3" placeholder="发送到所选通道… (Enter 发送,Shift+Enter 换行)" autocomplete="off" aria-label="发送内容"></textarea>
        <button type="button" id="send-btn" disabled>发送</button>
      </div>
    </div>
  </section>
</main>
<footer>
  <span class="dot" id="dot"></span>
  <span id="status">未连接</span>
  <span class="spacer"></span>
  <span id="chip-line">—<span class="sep">·</span>—</span>
  <span id="tx">TX 0 B</span><span id="tx-rate">0 B/s</span>
  <span id="rx">RX 0 B</span><span id="rx-rate">0 B/s</span>
  <span id="session" title="本次连接时长">0s</span>
  <span id="rows">0 行</span>
  <button id="remote-btn" title="远程访问地址">远程</button>
  <button id="version" title="关于 Mini RTT Viewer"></button>
  <button id="open-browser" hidden title="在系统默认浏览器打开本管理台(壳内窗口无法新开标签)">浏览器打开</button>
</footer>
<div id="ctx-menu" popover="auto" aria-label="日志操作">
  <button type="button" class="ctx-item" id="ctx-copy">复制选中文本</button>
  <button type="button" class="ctx-item" id="ctx-selectall">全选</button>
</div>
<dialog id="about">
  <div class="about-head">
    <img src="favicon.png" width="40" height="40" alt="">
    <div>
      <div class="about-name">Mini RTT Viewer</div>
      <div class="about-ver" id="about-ver"></div>
    </div>
  </div>
  <p class="about-line">SEGGER RTT 日志查看器 · UTF-8 / emoji 原样显示 · ANSI 彩色</p>
  <p class="about-line">MIT License</p>
  <div class="about-links">
    <button data-url="https://github.com/MisakaMikoto128/mini-rtt-viewer">GitHub 仓库</button>
    <button data-url="https://github.com/MisakaMikoto128/mini-rtt-viewer/blob/main/CHANGELOG.md">更新日志</button>
  </div>
  <div class="about-actions"><button id="about-close">关闭</button></div>
</dialog>
<dialog id="remote">
  <div class="about-head">
    <div>
      <div class="about-name">远程访问</div>
      <div class="about-ver">管理台即网页,同一地址打开即同一套界面</div>
    </div>
  </div>
  <button class="remote-card" id="remote-card-local" title="点击复制地址">
    <span class="remote-meta">
      <span class="remote-label">本机</span>
      <code class="remote-url" id="remote-url-local"></code>
    </span>
    <span class="remote-copy-state">
      <span class="st-idle"><svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5.5" y="5.5" width="9" height="9" rx="1.5"/><path d="M10.5 3.5V3A1.5 1.5 0 0 0 9 1.5H3A1.5 1.5 0 0 0 1.5 3v6A1.5 1.5 0 0 0 3 10.5h.5"/></svg>复制</span>
      <span class="st-done"><svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 8.5 6 12l7.5-8"/></svg>已复制</span>
    </span>
  </button>
  <button class="remote-card" id="remote-lan-row" hidden title="点击复制地址">
    <span class="remote-meta">
      <span class="remote-label">局域网</span>
      <code class="remote-url" id="remote-url-lan"></code>
    </span>
    <span class="remote-copy-state">
      <span class="st-idle"><svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5.5" y="5.5" width="9" height="9" rx="1.5"/><path d="M10.5 3.5V3A1.5 1.5 0 0 0 9 1.5H3A1.5 1.5 0 0 0 1.5 3v6A1.5 1.5 0 0 0 3 10.5h.5"/></svg>复制</span>
      <span class="st-done"><svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 8.5 6 12l7.5-8"/></svg>已复制</span>
    </span>
  </button>
  <p class="about-line" id="remote-hint" hidden>局域网未开放:以 --listen 0.0.0.0 启动后,其他设备打开局域网地址即可远程操作</p>
  <div class="about-actions"><button id="remote-close">关闭</button></div>
</dialog>
<script type="module" src="/app.js"></script>
</body>
</html>
